apiVersion: v1
kind: Namespace
metadata:
  name: isoloom-xben-100-view-the-admins
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: web
  template:
    metadata:
      labels:
        isoloom.com/machine: web
        net.isoloom.com/lab: member
    spec:
      hostname: web
      initContainers:
      - name: isoloom-probe
        image: busybox:1.37.0-musl
        command:
        - /bin/cp
        - /bin/busybox
        - /probe/busybox
        volumeMounts:
        - name: isoloom-probe
          mountPath: /probe
      - name: wait-mongo
        image: alpine:3.20
        command:
        - sh
        - -c
        - until nc -z mongo 27017; do sleep 2; done
      containers:
      - name: web
        image: isoloom/xben-100-view-the-admins-web
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5003
        readinessProbe:
          exec:
            command:
            - /.isoloom-probe/busybox
            - sh
            - -c
            - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 5003
          periodSeconds: 5
          failureThreshold: 60
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: isoloom-probe
        emptyDir: {}
